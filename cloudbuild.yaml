steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.parsing'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cag-images/cag-parsing:latest'
      - '.'
    timeout: '3600s'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cag-images/cag-parsing:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100

timeout: '3600s'
