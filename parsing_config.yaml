# CAG Parsing Pipeline Configuration
# ====================================
#
# This file centralizes all thresholds and parameters for the 10-phase parsing pipeline.
# Adjust these values to tune extraction quality, processing speed, and resource usage.
#
# Configuration priority:
#   1. Environment variables (PARSING_{PHASE}_{SETTING})
#   2. This YAML file
#   3. Code defaults (in src/parsing_pipeline/config.py)
#
# Example environment variable override:
#   export PARSING_TRIAGE_TEXT_THRESHOLD=200

# ==============================================================================
# PHASE 2: DOCUMENT TRIAGE
# ==============================================================================
triage:
  # Number of pages to sample for text density calculation
  # Higher = more accurate, slower
  sample_pages: 10

  # Minimum avg non-whitespace chars/page to classify as native_text
  # Raising this: More PDFs classified as scanned (more OCR)
  # Lowering this: Fewer PDFs classified as scanned (faster)
  text_threshold: 150

# ==============================================================================
# PHASE 3: OCR PROCESSING
# ==============================================================================
ocr:
  # OCR language: 'eng' for English, 'eng+hin' for English+Hindi
  # Note: Hindi requires tesseract-lang-hin package
  language: "eng"

  # Minimum OCR time (seconds); effective limit = max(timeout, pages * timeout_per_page)
  timeout: 600

  # ~3.4 s/page on an e2-standard-4 plus 1-2 min for the final PDF steps
  timeout_per_page: 8

  # OCRmyPDF output format: 'pdfa', 'pdf', 'pdfa-1', 'pdfa-2', 'pdfa-3'
  # 'pdf' skips the slow Ghostscript PDF/A pass; nothing downstream needs PDF/A
  output_type: "pdf"

  # ocrmypdf --optimize level; 0 disables optimisation (faster on image-heavy scans)
  optimize: 0

  # Turn pages scanned sideways upright before OCR (tesseract orientation detection)
  rotate_pages: true

  # Force OCR even if text layer exists
  force_ocr: true

# ==============================================================================
# PHASE 4: DOCUMENT SCAFFOLDING (TOC EXTRACTION)
# ==============================================================================
scaffolding:
  # Bookmark quality scoring (catches garbage PDF-merger bookmarks)
  # Minimum score (0-1 range, multiplied by 100) to accept PDF bookmarks
  bookmark_quality_threshold: 0.6

  # Patterns that indicate file-assembly/PDF-merger bookmarks (confidence penalty)
  # These catch garbage bookmarks like "01 Cover", "05 Final_Report", "p001"
  assembly_bookmark_patterns:
    - '^\d{2}\s+\w+'      # "01 Cover", "05 Final_Report"
    - '^Part\s*\d+$'      # Just "Part 1"
    - '^Section\s*\d+$'   # Just "Section 1"
    - '^p\d+'             # "p001"

  # Patterns that indicate high-quality CAG-specific bookmarks (confidence bonus)
  cag_quality_patterns:
    - '^Chapter\s+[IVX\d]+'
    - '^Annexure'
    - '^Executive\s+Summary'
    - '^Audit\s+(Objective|Finding|Scope)'
    - '^\d+\.\d+\s+[A-Z]'  # "2.3 Section Title"

# ==============================================================================
# PHASE 5: LAYOUT ANALYSIS (DOCLING)
# ==============================================================================
layout:
  # Minimum non-empty cells to accept Docling TableFormer table
  # Quality gate to reject garbage tables
  table_min_non_empty_cells: 3

  # Docling accelerator: 'auto', 'cpu', 'mps' (Apple Silicon), 'cuda' (NVIDIA)
  # 'auto' detects GPU at runtime; 'cuda' for NVIDIA GPU, 'cpu' fallback
  # GPU is 5-10x faster for layout analysis
  accelerator_device: "auto"

  # TableFormer mode: 'FAST' or 'ACCURATE'
  # ACCURATE: Better quality for scanned PDFs, ~2x slower on CPU
  # With GPU: ACCURATE is fast enough (~5 min for large PDFs)
  # Timeout (conversion_timeout) prevents hangs if running on CPU
  tableformer_mode: "ACCURATE"

  # Maximum time (seconds) for Docling conversion before timeout
  # Large PDFs can take 30+ minutes on CPU - set limit to prevent CI hangs
  conversion_timeout: 1800  # 30 minutes (floor)
  # Effective limit = max(conversion_timeout, pages * conversion_timeout_per_page)
  # Table-heavy reports run ~7-8 s/page on CPU; 426-page 2025_06 needs ~50 min
  conversion_timeout_per_page: 12

# ==============================================================================
# PHASE 5.5: TOC RECONCILIATION (FUSE HEURISTIC + DOCLING)
# ==============================================================================
toc_reconciliation:
  # Minimum string similarity (0-1) for title matching
  # Raising this: Stricter matching, fewer false matches
  # Lowering this: More lenient, risk of incorrect merges
  similarity_threshold: 0.65

  # Minimum Docling section headers to enable reconciliation
  min_docling_headers: 3

  # Quality tiers for reconciliation strategy
  # High (>=70): Supplement with Docling
  # Medium (40-69): Merge equally
  # Low (<40): Prefer Docling
  quality_high_threshold: 70
  quality_medium_threshold: 40

# ==============================================================================
# PHASE 6: CONTENT EXTRACTION (TABLES, TEXT, IMAGES)
# ==============================================================================
content_extraction:
  # ============================================================================
  # PDFPLUMBER TABLE SETTINGS (Tier 1)
  # ============================================================================
  pdfplumber_snap_tolerance: 5
  pdfplumber_join_tolerance: 5

  # Table quality thresholds
  # Minimum confidence to accept pdfplumber extraction
  table_min_confidence: 0.2

  # Minimum fraction of non-empty cells
  # Rejects tables with >70% empty cells
  table_fill_ratio_threshold: 0.3

  # Minimum non-empty cells required
  table_min_non_empty_cells: 3

  # Confidence scoring factors
  table_empty_ratio_penalty_threshold: 0.5
  table_column_consistency_threshold: 0.7
  table_numeric_ratio_threshold: 0.1

# ==============================================================================
# PHASE 7: HIERARCHICAL CHUNKING
# ==============================================================================
chunking:
  # Minimum Jaccard similarity for column structure to merge multi-page tables
  # Raising this: Stricter matching, fewer false merges
  # Lowering this: More lenient, risk of merging unrelated tables
  multi_page_table_column_similarity_threshold: 0.8

  # Longest child chunk; longer tables split by rows (header repeated), text by sentences.
  # The embedding model reads ~2,048 tokens (~4-8K chars) and silently drops the rest.
  max_child_chunk_chars: 4000

# ==============================================================================
# PHASE 9: SEMANTIC ENRICHMENT (FINDINGS, RECOMMENDATIONS)
# ==============================================================================
semantic_enrichment:
  # Findings and recommendations from Gemini, one call per section (packed up to
  # llm_max_chars_per_call characters); the regex extractors are the cross-check and
  # the fallback for a section whose call fails
  llm_extraction: true
  llm_model: "gemini-3.8-flash"
  llm_thinking_level: "low"
  llm_max_chars_per_call: 24000

  # Tier-specific monetary thresholds for finding severity (in crore)
  # Union reports: Larger amounts
  # State reports: Medium amounts
  # Local Body reports: Smaller amounts
  severity_thresholds:
    union:
      critical: 100
      high: 10
      medium: 1
      low: 0
    state:
      critical: 50
      high: 5
      medium: 0.5
      low: 0
    local_body:
      critical: 10
      high: 1
      medium: 0.10
      low: 0

  # Minimum confidence to classify chunk as audit finding
  # P3: Raised from 0.4 to 0.5 - lower confidence findings go to LLM validation
  finding_confidence_threshold: 0.5

# ==============================================================================
# GEMINI LIMITER (all LLM calls: Phase 9 validation, 10a, 10b)
# ==============================================================================
gemini:
  # One budget per model, in tokens per minute, enforced over a rolling window.
  # Capacity: Standard PayGo Tier 1 baseline throughput (org level, per model):
  # Pro 500,000 and Flash 2,000,000 TPM.
  # https://docs.cloud.google.com/vertex-ai/generative-ai/docs/standard-paygo (read 2026-10-08).
  # The page does not say how tokens are counted, and states that the tiers do not
  # apply to preview models; Agent Platform's consumed_token_throughput metric counts
  # input x1, cached input x0.1 and output (thinking included) x5 on 3.8 Flash and
  # x6 on 3.1 Pro (matches our Cloud Monitoring data exactly), so the budget counts
  # the same way. Traffic may burst past the baseline on a best-effort basis.
  models:
    gemini-3.1-pro-preview:
      capacity_tpm: 500000
      ceiling: 24
      output_weight: 6
    gemini-3.8-flash:
      capacity_tpm: 2000000
      # 64 at first; Phase 10 on three reports kept 64 in flight with no 429s at 4% of
      # the budget, so the ceiling, not the budget, was the limit
      ceiling: 96
      output_weight: 5
  # Any other model
  default_model:
    capacity_tpm: 500000
    ceiling: 16
    output_weight: 6

  window_seconds: 60
  # Budget = capacity x utilisation. A step down needs 429s on at least 10% of the
  # window's attempts and at least 5 of them; a window under 2% steps back up.
  # After any step, hold for a full window.
  start_utilisation: 1.0
  max_utilisation: 1.0
  min_utilisation: 0.30
  utilisation_step: 0.10
  step_down_rate: 0.10
  step_down_min_throttles: 5
  step_up_rate: 0.02
  hold_seconds: 60

  # Estimates before a call: prompt characters / 4, plus these until a tag has real counts
  image_tokens: 1100
  default_output_tokens: 1500

  # A failed call retries alone: random 1-3 s first wait, doubling, capped at 30 s,
  # for up to 5 minutes
  retry_first_wait_seconds: [1, 3]
  retry_max_wait_seconds: 30
  retry_window_seconds: 300

  # Time budget per phase (minutes); later requests fail and count as losses. 0 = none
  phase9_deadline_minutes: 60
  phase10a_deadline_minutes: 180
  phase10b_deadline_minutes: 180

# ==============================================================================
# TRACE INSTRUMENTATION (DEBUGGING & OBSERVABILITY)
# ==============================================================================
instrumentation:
  # Tracing is switched on with the --trace CLI flag
  # Directory for trace markdown files
  # Each report generates: {report_id}_trace_{date}.md
  output_dir: "logs/traces"

  # Maximum samples per category (e.g., accepted/rejected TOC entries)
  # Keeps trace files manageable while providing representative examples
  sample_count: 5

  # Flush events after each phase for crash protection
  # Creates incremental partial file for debugging pipeline crashes
  incremental_flush: false

# ==============================================================================
# OPERATIONAL NOTES
# ==============================================================================
#
# Common tuning scenarios:
#
# 1. Faster processing (lower quality):
#    - triage.text_threshold: 100 (fewer OCR operations)
#    - layout.tableformer_mode: "FAST"
#
# 2. Higher accuracy (slower):
#    - triage.text_threshold: 200 (more aggressive OCR)
#    - toc_reconciliation.similarity_threshold: 0.70 (stricter matching)
#
# 3. GPU acceleration:
#    - layout.accelerator_device: "mps" (Apple Silicon)
#    - layout.accelerator_device: "cuda" (NVIDIA GPU)
