# Enrichment Patterns Configuration
# =================================
# Settings read by the Phase 9 extractors (pattern_loader.py). Findings and
# recommendations come from Gemini (llm_finding_extractor.py); the regex
# extractors that cross-check them keep their patterns in code.

# ═══════════════════════════════════════════════════════════════════════
# ENTITY ALIASES
# ═══════════════════════════════════════════════════════════════════════
# Maps common abbreviations/variants to canonical entity names.
# Loaded by EntityExtractor: an alias found in the text is stored under its canonical name.

entity_aliases:
  ministries:
    "Ministry of Finance":
      - "MoF"
      - "Finance Ministry"
      - "Department of Economic Affairs"
      - "DEA"
    "Ministry of Railways":
      - "MoR"
      - "Railway Ministry"
      - "Railways"
    "Ministry of Road Transport and Highways":
      - "MoRTH"
      - "Road Transport Ministry"
    "Ministry of Defence":
      - "MoD"
      - "Defence Ministry"
    "Ministry of Health and Family Welfare":
      - "MoHFW"
      - "Health Ministry"
    "Ministry of Agriculture":
      - "MoA"
      - "Agriculture Ministry"

  organizations:
    "National Highways Authority of India":
      - "NHAI"
      - "National Highways Authority"
      - "National Highway Authority of India"
    "Food Corporation of India":
      - "FCI"
    "Central Board of Direct Taxes":
      - "CBDT"
    "Airports Authority of India":
      - "AAI"
    "Indian Railways":
      - "Railways"
      - "Railway Board"

# ═══════════════════════════════════════════════════════════════════════
# CONFIDENCE THRESHOLDS
# ═══════════════════════════════════════════════════════════════════════

confidence_thresholds:
  section_classification: 0.5  # Below this, a section is flagged low-confidence
