# =============================================================================
# Deploy API to Cloud Run
# =============================================================================
# Builds and deploys the API container to Google Cloud Run.
# Triggers on push to main branch (specific paths) or manual dispatch.

name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'src/api/**'
      - 'src/rag_pipeline/**'
      - 'src/core/**'
      - 'src/entity_graph/**'
      - 'src/observability/**'
      - 'frontend/**'
      - 'Dockerfile'
      - 'requirements.docker.txt'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip CI tests before deploy'
        required: false
        type: boolean
        default: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: cag-api
  REGISTRY: us-central1-docker.pkg.dev

jobs:
  # Run CI first (unless skipped)
  ci:
    if: ${{ !inputs.skip_tests }}
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    name: Build and Deploy
    needs: [ci]
    if: ${{ always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/cag-images/${{ env.SERVICE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/cag-images/${{ env.SERVICE_NAME }}:latest
          build-args: |
            VITE_PUBLIC_POSTHOG_KEY=${{ secrets.POSTHOG_KEY }}
            VITE_ACCESS_CODE=${{ secrets.ACCESS_CODE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/cag-images/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Get Service URL
        id: get-url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Service deployed to: $URL"

      - name: Health Check
        run: |
          URL="${{ steps.get-url.outputs.url }}"
          echo "Checking health at ${URL}/health"

          for i in {1..5}; do
            if curl -sf "${URL}/health"; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i failed, waiting..."
            sleep 10
          done

          echo "Health check failed after 5 attempts"
          exit 1

      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** ${{ env.SERVICE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ env.REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.get-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
