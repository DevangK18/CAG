# =============================================================================
# Run Parsing Pipeline (GPU)
# =============================================================================
# GPU variant of run-parsing.yml. Drives a separate VM with an NVIDIA GPU so
# Docling (Phase 5) runs on CUDA. The CPU workflow and VM are untouched.
#
# Key details:
# - VM runs a Google Deep Learning VM image (driver + NVIDIA Container Toolkit
#   preinstalled); infra/scripts/setup-gpu-vm.sh adds Docker idempotently
# - Always runs the container with --gpus all and FAILS if the host GPU or
#   torch.cuda inside the image is unavailable (never silently falls back to CPU)
# - Results go to gs://<bucket>/<output_prefix>/..., never to production paths;
#   the legacy processed/manifest.json is never uploaded
# - Refuses to start while a run is active on any VM in the list
# - Same detached design as the CPU workflow: the VM enforces max_hours,
#   streams its log + status to gs://<bucket>/runs-gpu/<run_id>/ and powers
#   itself off; this job polls until done or GitHub's 6h cap nears
# - Tries an ordered list of interchangeable GPU VMs (stand-bys in other zones and
#   a T4 back-up) and runs on the first that starts: GPUs often stock out in one zone.
#   The project's GPU quota is one, so exactly one of them runs at a time

name: Run Parsing Pipeline (GPU)

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: 'Manifest file name (in gs://bucket/manifests/)'
        required: true
        default: 'CAG Main Docs CCDT.xlsx'
        type: string
      skip_phases:
        description: 'Phases to skip (comma-separated, e.g., 10a,10b,10c)'
        required: false
        type: string
        default: ''
      reports:
        description: 'Specific report IDs (space-separated, leave empty for all)'
        required: false
        type: string
        default: ''
      jobs:
        description: 'Several jobs on one VM, run one after another: JSON list of {"manifest", "reports", "skip_phases", "workers"}. Overrides manifest, reports and skip_phases'
        required: false
        type: string
        default: ''
      output_prefix:
        description: 'GCS prefix for results: gs://bucket/<prefix>/processed/<tier>/ etc.'
        required: true
        type: string
        default: 'gpu-test'
      vms:
        description: 'GPU VMs to try, in order (name or name:zone; the zone is looked up when omitted)'
        required: true
        type: string
        default: 'cag-parsing-gpu-vm cag-parsing-gpu-vm-2 cag-parsing-gpu-vm-t4'
      workers:
        description: 'Reports processed at once within a phase (--workers); a job may set its own'
        required: false
        type: string
        default: '1'
      start_rounds:
        description: 'Rounds over the VM list before giving up (2 min between rounds)'
        required: false
        type: string
        default: '20'
      keep_vm_running:
        description: 'Keep VM running after completion (for debugging)'
        required: false
        type: boolean
        default: false
      max_hours:
        description: 'Max pipeline runtime on the VM in hours (enforced on the VM, not by GitHub)'
        required: false
        type: string
        default: '12'

# One GPU run at a time (the GPU quota is one); queued runs wait instead of
# cancelling a live run
concurrency:
  group: run-parsing-gpu
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  DATA_BUCKET: cag-data-443e4a28
  OUTPUT_PREFIX: ${{ inputs.output_prefix }}
  CONTAINER_NAME: cag-parsing-gpu-run

jobs:
  run-parsing-gpu:
    name: Run Parsing Pipeline (GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 360  # GitHub-hosted cap; pipeline runtime is bounded by max_hours on the VM

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate inputs
        run: |
          echo "JOB_START=$(date +%s)" >> $GITHUB_ENV
          PREFIX="${{ inputs.output_prefix }}"
          if ! [[ "${PREFIX}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::output_prefix must be a single path segment like 'gpu-test' (got '${PREFIX}')"
            exit 1
          fi
          # Never let GPU output land in the production tree
          case "${PREFIX}" in
            raw|processed|batch_jobs|manifests|runs|runs-gpu|logs|extraction_images|entity_graph|canonical|traces)
              echo "::error::output_prefix '${PREFIX}' collides with a production path"
              exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # One image per commit: a second dispatch of the same commit skips the build,
      # and a build reuses the registry's layer cache, so a code-only change does
      # not reinstall the dependencies
      - name: Build and Push GPU Parsing Image
        run: |
          # Separate image name so the CPU workflow's cag-parsing:latest is never touched
          REPO="us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/cag-images/cag-parsing-gpu"
          IMAGE="${REPO}:${{ github.sha }}"
          echo "PARSING_IMAGE=${IMAGE}" >> $GITHUB_ENV
          if gcloud artifacts docker images describe "${IMAGE}" > /dev/null 2>&1; then
            echo "✅ ${IMAGE} already exists; skipping the build"
            exit 0
          fi
          DOCKERFILE=Dockerfile.parsing
          [ -f Dockerfile.parsing-gpu ] && DOCKERFILE=Dockerfile.parsing-gpu
          # The image is large; make room on the runner
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
          echo "Building GPU parsing image: ${IMAGE} (from ${DOCKERFILE})"
          docker buildx build -f "${DOCKERFILE}" \
            -t "${IMAGE}" -t "${REPO}:latest" \
            --cache-from "type=registry,ref=${REPO}:buildcache" \
            --cache-to "type=registry,ref=${REPO}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true" \
            --push .
          echo "✅ GPU parsing image built and pushed"

      - name: Setup SSH Key
        run: |
          # Add the SSH key to project metadata BEFORE starting the VM so it syncs at boot
          gcloud compute config-ssh --project=${{ env.PROJECT_ID }} --quiet

      # A run continues on its VM after this job stops polling, so every VM in the
      # list is checked, not only the one this run will use
      - name: Refuse to start while a run is active
        id: guard
        run: |
          : > /tmp/vms.txt
          for ENTRY in ${{ inputs.vms }}; do
            NAME="${ENTRY%%:*}"
            ZONE_IN=""; [ "${ENTRY}" != "${NAME}" ] && ZONE_IN="${ENTRY#*:}"
            if [ -z "${ZONE_IN}" ]; then
              ZONE_IN=$(gcloud compute instances list --project=${{ env.PROJECT_ID }} \
                --filter="name=${NAME}" --format="value(zone.basename())" | head -1)
            fi
            if [ -z "${ZONE_IN}" ]; then
              echo "::warning::VM ${NAME} not found; skipping it"
              continue
            fi
            echo "${NAME} ${ZONE_IN}" >> /tmp/vms.txt
          done
          if [ ! -s /tmp/vms.txt ]; then
            echo "::error::None of the VMs in '${{ inputs.vms }}' exist"
            exit 1
          fi
          cat /tmp/vms.txt

          # Only a confirmed active run sets busy (which keeps that VM running). An SSH
          # failure is reported as such.
          while read -r NAME VZONE; do
            # A failed lookup must not stop the step (bash -e); the VM is then skipped
            STATUS=$(gcloud compute instances describe ${NAME} --zone=${VZONE} \
              --project=${{ env.PROJECT_ID }} --format="value(status)" || echo UNKNOWN)
            echo "${NAME} (${VZONE}): ${STATUS}"
            [ "${STATUS}" = "RUNNING" ] || continue
            if ! OUT=$(gcloud compute ssh ${NAME} --zone=${VZONE} --project=${{ env.PROJECT_ID }} \
              --command='if pgrep -f "[r]un_detached.sh" >/dev/null || [ -n "$(docker ps -q --filter name=cag-parsing)" ]; then echo busy; else echo idle; fi' < /dev/null); then
              echo "::error::Could not check for an active run: SSH to ${NAME} failed."
              exit 1
            fi
            ACTIVE=$(echo "${OUT}" | tail -1)
            if [ "${ACTIVE}" = "busy" ]; then
              echo "busy=true" >> $GITHUB_OUTPUT
              echo "::error::A parsing run is already active on ${NAME}. Wait for it to finish."
              exit 1
            elif [ "${ACTIVE}" != "idle" ]; then
              echo "::error::Active-run check on ${NAME} returned unexpected output: ${ACTIVE}"
              exit 1
            fi
            # Already running and idle: use it (the GPU quota leaves no room for another)
            echo "${NAME} ${VZONE}" > /tmp/running_idle.txt
          done < /tmp/vms.txt

      - name: Start a GPU VM
        id: start
        run: |
          use() {
            echo "VM_NAME=$1" >> $GITHUB_ENV
            echo "ZONE=$2" >> $GITHUB_ENV
            echo "vm=$1 ($2)" >> $GITHUB_OUTPUT
            echo "Using $1 in $2"
            exit 0
          }
          if [ -s /tmp/running_idle.txt ]; then
            read -r NAME VZONE < /tmp/running_idle.txt
            use "${NAME}" "${VZONE}"
          fi
          # GPUs stock out per zone: try each VM in order, then go round again
          ROUNDS=${{ inputs.start_rounds || '20' }}
          for ROUND in $(seq 1 ${ROUNDS}); do
            while read -r NAME VZONE; do
              STATUS=$(gcloud compute instances describe ${NAME} --zone=${VZONE} \
                --project=${{ env.PROJECT_ID }} --format="value(status)" || echo UNKNOWN)
              if [ "${STATUS}" = "TERMINATED" ]; then
                echo "Round ${ROUND}: starting ${NAME} in ${VZONE}..."
                if gcloud compute instances start ${NAME} --zone=${VZONE} \
                  --project=${{ env.PROJECT_ID }} < /dev/null; then
                  use "${NAME}" "${VZONE}"
                fi
              else
                echo "Round ${ROUND}: ${NAME} is ${STATUS}; skipping"
              fi
            done < /tmp/vms.txt
            [ ${ROUND} -lt ${ROUNDS} ] && { echo "No VM started; next round in 2 min"; sleep 120; }
          done
          echo "::error::No GPU VM could be started after ${ROUNDS} rounds (likely GPU stockout everywhere). Retry later."
          exit 1

      - name: Wait for VM SSH
        run: |
          for i in {1..12}; do
            echo "Attempt $i: trying SSH..."
            if gcloud compute ssh ${{ env.VM_NAME }} \
              --zone=${{ env.ZONE }} \
              --project=${{ env.PROJECT_ID }} \
              --command="echo 'VM is ready'" 2>&1; then
              echo "VM SSH is ready"
              exit 0
            fi
            echo "Attempt $i failed, waiting..."
            sleep 20
          done
          echo "Failed to connect to VM"
          exit 1

      - name: Prepare GPU host
        run: |
          # Idempotent: verifies the driver and installs Docker / NVIDIA runtime only if missing
          gcloud compute scp infra/scripts/setup-gpu-vm.sh ${{ env.VM_NAME }}:/tmp/setup-gpu-vm.sh \
            --zone=${{ env.ZONE }} --project=${{ env.PROJECT_ID }}
          gcloud compute ssh ${{ env.VM_NAME }} \
            --zone=${{ env.ZONE }} \
            --project=${{ env.PROJECT_ID }} \
            --command="sudo -n bash /tmp/setup-gpu-vm.sh"

      - name: Create and copy run script
        env:
          IN_JOBS: ${{ inputs.jobs }}
          IN_MANIFEST: ${{ inputs.manifest }}
          IN_REPORTS: ${{ inputs.reports }}
          IN_SKIP: ${{ inputs.skip_phases }}
          IN_WORKERS: ${{ inputs.workers }}
        run: |
          cat > /tmp/run_pipeline.sh << 'SCRIPT_EOF'
          #!/bin/bash
          set -e

          # Docker config under a writable HOME (SSH HOME may be stale)
          export HOME="/var/tmp/cag"
          export DOCKER_CONFIG="${HOME}/.docker"
          mkdir -p "${DOCKER_CONFIG}"
          echo '{"credHelpers":{"us-central1-docker.pkg.dev":"gcr","gcr.io":"gcr"}}' > "${DOCKER_CONFIG}/config.json"

          # Configuration - these are replaced by sed below
          DATA_BUCKET="${DATA_BUCKET}"
          PROJECT_ID="${PROJECT_ID}"
          PROJECT_ID=$(echo "${PROJECT_ID}" | tr -d '[:space:]')
          OUTPUT_PREFIX="${OUTPUT_PREFIX}"
          CONTAINER_NAME="${CONTAINER_NAME}"
          RUN_ID="${RUN_ID}"
          MAX_HOURS="${MAX_HOURS}"
          GCS_OUT="gs://${DATA_BUCKET}/${OUTPUT_PREFIX}"
          # One line per job: manifest|skip phases|report IDs|workers
          JOBS_FILE=/tmp/jobs.txt
          JOB_COUNT=$(grep -c . "${JOBS_FILE}")
          RUN_DIR=/var/tmp/cag/runs-gpu/${RUN_ID}
          DEADLINE=$(( $(date +%s) + $(awk "BEGIN { printf \"%d\", ${MAX_HOURS} * 3600 }") ))

          echo "============================================="
          echo "CAG Parsing Pipeline (GPU)"
          echo "============================================="
          echo "PROJECT_ID: ${PROJECT_ID}"
          echo "DATA_BUCKET: ${DATA_BUCKET}"
          echo "JOBS (manifest|skip|reports|workers):"
          nl -ba "${JOBS_FILE}"
          echo "OUTPUT: ${GCS_OUT}/"
          echo ""

          # Never run beside another parsing container: the wipe below would delete its data
          if [ -n "$(docker ps -q --filter name=cag-parsing)" ]; then
            echo "ERROR: a parsing container is already running on this VM"
            docker ps --filter name=cag-parsing
            exit 14
          fi

          # Fail fast: a GPU run must never silently fall back to CPU
          if ! command -v nvidia-smi &> /dev/null || ! nvidia-smi &> /dev/null; then
            echo "ERROR: nvidia-smi not available on the host; refusing to run on CPU"
            exit 10
          fi
          echo "🚀 Host GPU: $(nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader)"

          WORK_DIR=/var/tmp/cag
          # Start from the GCS state every run: anything deleted or quarantined in GCS
          # must not come back from this VM's copy of an earlier run
          echo "Clearing previous run data in ${WORK_DIR}"
          sudo -n rm -rf "${WORK_DIR:?}/data" "${WORK_DIR:?}/logs"
          mkdir -p ${WORK_DIR}/data/{raw,processed,batch_jobs,extraction_images,entity_graph,canonical}/{union,state,local_body}
          mkdir -p ${WORK_DIR}/data/processed/ocred
          mkdir -p ${WORK_DIR}/data/batch_jobs/{jobs,overviews,summaries,hierarchical,visual_extraction}
          mkdir -p ${WORK_DIR}/data/extraction_images/{tables,charts}
          mkdir -p ${WORK_DIR}/logs/traces/{union,state,local_body}

          # The parsing image is ~32GB unpacked; keep only the current image
          echo "Removing old images..."
          docker image prune -f
          df -h / | tail -1

          GCLOUD_IMAGE="gcr.io/google.com/cloudsdktool/google-cloud-cli:stable"
          docker pull ${GCLOUD_IMAGE}

          # gsutil via Docker; --network=host reaches the metadata server for auth
          run_gsutil() {
            docker run --rm --network=host \
              -v ${WORK_DIR}:/workspace \
              ${GCLOUD_IMAGE} \
              gsutil "$@"
          }

          # PDFs are read from the shared raw/ cache (read-only); processed state
          # comes only from the output prefix so production data is never mixed in
          echo "Syncing data from GCS..."
          # Fatal on failure: running from a partial copy would upload a mixed state
          run_gsutil -m rsync -r gs://${DATA_BUCKET}/raw/ /workspace/data/raw/
          # A new output prefix has no processed/ yet; anything else that fails here is fatal
          if run_gsutil ls "${GCS_OUT}/processed/" > /tmp/prefix_ls.txt 2>&1; then
            run_gsutil -m rsync -r ${GCS_OUT}/processed/ /workspace/data/processed/
          elif grep -q "matched no objects" /tmp/prefix_ls.txt; then
            echo "No previous output under ${GCS_OUT}/processed/ (new prefix)"
          else
            cat /tmp/prefix_ls.txt
            exit 12
          fi

          PARSING_IMAGE="${PARSING_IMAGE}"
          echo "Pulling ${PARSING_IMAGE}..."
          docker pull "${PARSING_IMAGE}" || {
            echo "ERROR: Failed to pull parsing image ${PARSING_IMAGE}"
            exit 1
          }
          # Images are tagged by commit; keep only the one this run uses
          for OLD in $(docker images --format '{{.Repository}}:{{.Tag}}' | grep '/cag-parsing-gpu:' | grep -vxF "${PARSING_IMAGE}"); do
            docker rmi "${OLD}" || true
          done
          docker image prune -f
          df -h / | tail -1

          # Fail fast if PyTorch inside the image cannot use the GPU
          echo "Checking CUDA inside the image..."
          docker run --rm --gpus all --entrypoint python "${PARSING_IMAGE}" -c "
          import sys, torch
          ok = torch.cuda.is_available()
          print('torch', torch.__version__, 'cuda', torch.version.cuda, 'available', ok,
                torch.cuda.get_device_name(0) if ok else '')
          sys.exit(0 if ok else 1)
          " || { echo "ERROR: torch.cuda not available in image; refusing to run on CPU"; exit 11; }

          # Run one job: its own manifest, run ID, exit code, run summary and upload
          run_job() {
            local N="$1" MANIFEST="$2" SKIP="$3" REPORTS="$4" JOB_RUN_ID="$5" WORKERS="${6:-1}"
            local SKIP_ARG="" REPORTS_ARG="" PIPELINE_RC REMAINING
            [ -n "${SKIP}" ] && SKIP_ARG="--skip ${SKIP}"
            [ -n "${REPORTS}" ] && REPORTS_ARG="--reports ${REPORTS}"
            echo ""
            echo "============================================="
            echo "Job ${N}/${JOB_COUNT}: ${MANIFEST} (run ${JOB_RUN_ID})"
            echo "  Skip: ${SKIP:-none}   Reports: ${REPORTS:-all}   Workers: ${WORKERS}"
            echo "============================================="

            echo "Downloading manifest..."
            if ! run_gsutil cp "gs://${DATA_BUCKET}/manifests/${MANIFEST}" /workspace/manifest.xlsx; then
              echo "ERROR: could not download manifest ${MANIFEST}"
              return 15
            fi

            # The time limit covers all jobs together
            REMAINING=$(( DEADLINE - $(date +%s) ))
            if [ ${REMAINING} -le 0 ]; then
              echo "ERROR: no time left for this job (max ${MAX_HOURS}h for the dispatch)"
              return 124
            fi

            echo "Starting parsing pipeline..."
            docker rm -f ${CONTAINER_NAME} 2>/dev/null || true
            # Keep going on a non-zero exit (3 = partial, 4 = nothing selected) so the
            # results, logs and run summary are still uploaded; the code is returned at the end.
            # Errors are handled explicitly in this function (the caller runs it with set +e)
            # shellcheck disable=SC2086  # SKIP_ARG / REPORTS_ARG split into words on purpose
            timeout --kill-after=2m "${REMAINING}s" docker run --rm --name ${CONTAINER_NAME} --network=host --gpus all --shm-size=8g \
              -v ${WORK_DIR}/data:/app/data \
              -v ${WORK_DIR}/logs:/app/logs \
              -v ${WORK_DIR}/manifest.xlsx:/app/manifest.xlsx \
              -e DATA_BUCKET=${DATA_BUCKET} \
              -e GOOGLE_CLOUD_PROJECT=${PROJECT_ID} \
              -e VERTEX_AI_REGION=us-central1 \
              -e USE_VERTEX_AI=true \
              -e USE_VERTEX_EMBEDDINGS=true \
              -e LLM_PROVIDER=gemini \
              -e RUN_ID=${JOB_RUN_ID} \
              ${PARSING_IMAGE} \
              manifest.xlsx --workers "${WORKERS}" ${SKIP_ARG} ${REPORTS_ARG}
            PIPELINE_RC=$?
            echo "Pipeline exit code: ${PIPELINE_RC}"
            if [ ${PIPELINE_RC} -eq 124 ] || [ ${PIPELINE_RC} -eq 137 ]; then
              # Killing the docker client does not stop the container
              echo "Pipeline exceeded the time limit; stopping the container and uploading what exists"
              docker rm -f ${CONTAINER_NAME} 2>/dev/null || true
            fi

            # Results go under the output prefix only. The legacy processed/manifest.json
            # is excluded (the per-tier manifests replace it); *.stale and Phase 8
            # working files stay on the VM. raw/ is not uploaded: it was only read from
            # the shared cache.
            echo "Uploading results to ${GCS_OUT}/ ..."
            if ! run_gsutil -m rsync -r -x '^manifest\.json$|.*\.stale$|.*\.working$' /workspace/data/processed ${GCS_OUT}/processed/ \
              || ! run_gsutil -m rsync -r /workspace/data/batch_jobs ${GCS_OUT}/batch_jobs/; then
              echo "ERROR: uploading results to ${GCS_OUT}/ failed"
              return 16
            fi
            run_gsutil -m rsync -r /workspace/data/extraction_images ${GCS_OUT}/extraction_images/ 2>/dev/null || true
            run_gsutil -m rsync -r /workspace/data/entity_graph ${GCS_OUT}/entity_graph/ 2>/dev/null || true
            run_gsutil -m rsync -r /workspace/data/canonical ${GCS_OUT}/canonical/ 2>/dev/null || true
            run_gsutil -m rsync -r /workspace/logs/traces ${GCS_OUT}/traces/ 2>/dev/null || true
            run_gsutil -m cp /workspace/logs/*.log ${GCS_OUT}/logs/ 2>/dev/null || true
            run_gsutil -m cp "/workspace/logs/run_summary_${JOB_RUN_ID}.json" gs://${DATA_BUCKET}/runs-gpu/${RUN_ID}/ 2>/dev/null || true
            run_gsutil -m rsync -r /workspace/data/dead_letter_queue ${GCS_OUT}/dead_letter_queue/ 2>/dev/null || true

            # A report that failed this run has its previous output quarantined locally
            # (renamed *.stale); move the GCS original to quarantine/<run_id>/ under the
            # output prefix so it is not served
            # Read the list with the parsing image (the gcloud image has no Python)
            local QUARANTINED
            if ! QUARANTINED=$(docker run --rm --entrypoint python3 -v ${WORK_DIR}:/workspace ${PARSING_IMAGE} -c "
          import json, pathlib
          s = pathlib.Path('/workspace/logs/run_summary_${JOB_RUN_ID}.json')
          for f in (json.loads(s.read_text()).get('quarantined_files') or []) if s.exists() else []:
              print(f)
          "); then
              echo "ERROR: could not read the run summary; quarantined outputs were not moved in GCS"
              QUARANTINED=""
              # Keep the pipeline's own code; only a clean run is turned into a failure
              if [ ${PIPELINE_RC} -eq 0 ]; then PIPELINE_RC=13; fi
            fi
            for f in ${QUARANTINED}; do
              echo "Quarantining stale output in GCS: ${OUTPUT_PREFIX}/processed/${f} -> ${OUTPUT_PREFIX}/quarantine/${JOB_RUN_ID}/processed/${f}"
              run_gsutil -q mv "${GCS_OUT}/processed/${f}" "${GCS_OUT}/quarantine/${JOB_RUN_ID}/processed/${f}" || echo "  (not in GCS)"
            done
            return ${PIPELINE_RC}
          }

          # Jobs run one after another on this VM. The dispatch's code is the worst job's:
          # a hard failure beats 3 (partial), which beats 4 (nothing selected)
          FINAL_RC=0
          N=0
          : > "${RUN_DIR}/jobs.txt"
          while IFS='|' read -r MANIFEST SKIP REPORTS WORKERS <&3; do
            [ -n "${MANIFEST}" ] || continue
            N=$((N + 1))
            JOB_RUN_ID="${RUN_ID}"
            [ "${JOB_COUNT}" -gt 1 ] && JOB_RUN_ID="${RUN_ID}-${N}"
            set +e
            run_job "${N}" "${MANIFEST}" "${SKIP}" "${REPORTS}" "${JOB_RUN_ID}" "${WORKERS}"
            RC=$?
            set -e
            echo "${N}|${JOB_RUN_ID}|${RC}|${MANIFEST}" >> "${RUN_DIR}/jobs.txt"
            echo "Job ${N} (${MANIFEST}) finished with exit code ${RC}"
            if [ ${RC} -eq 16 ]; then
              echo "ERROR: stopping: results can no longer be uploaded"
              FINAL_RC=16
              break
            fi
            if [ ${RC} -ne 0 ]; then
              case "${FINAL_RC}:${RC}" in
                0:*) FINAL_RC=${RC} ;;
                4:3) FINAL_RC=3 ;;
                3:4|4:4|3:3) ;;
                [34]:*) FINAL_RC=${RC} ;;
              esac
            fi
          done 3< "${JOBS_FILE}"

          echo ""
          echo "============================================="
          echo "Parsing pipeline (GPU) finished: ${N} job(s), exit code ${FINAL_RC}"
          cat "${RUN_DIR}/jobs.txt"
          echo "============================================="
          exit ${FINAL_RC}
          SCRIPT_EOF

          # Jobs: the 'jobs' JSON list, or the single manifest/reports/skip_phases inputs.
          # Values are checked here because they end up on a command line on the VM.
          python3 - > /tmp/jobs.txt << 'PY_EOF'
          import json, os, re, sys
          raw = os.environ["IN_JOBS"].strip()
          jobs = json.loads(raw) if raw else [{
              "manifest": os.environ["IN_MANIFEST"],
              "reports": os.environ["IN_REPORTS"],
              "skip_phases": os.environ["IN_SKIP"],
          }]
          if not isinstance(jobs, list) or not jobs:
              sys.exit("jobs must be a non-empty JSON list")
          for job in jobs:
              manifest = str(job.get("manifest") or "").strip()
              reports = " ".join(str(job.get("reports") or "").split())
              skip = str(job.get("skip_phases") or "").replace(" ", "")
              workers = str(job.get("workers") or os.environ.get("IN_WORKERS") or "1").strip()
              if not re.fullmatch(r"[A-Za-z0-9 ._()-]+\.xlsx", manifest):
                  sys.exit(f"bad manifest name: {manifest!r}")
              if not re.fullmatch(r"[A-Za-z0-9_. -]*", reports):
                  sys.exit(f"bad report IDs: {reports!r}")
              if not re.fullmatch(r"[0-9a-c.,]*", skip):
                  sys.exit(f"bad skip_phases: {skip!r}")
              if not re.fullmatch(r"[1-9]|1[0-6]", workers):
                  sys.exit(f"workers must be 1 to 16: {workers!r}")
              print(f"{manifest}|{skip}|{reports}|{workers}")
          PY_EOF
          echo "Jobs (manifest|skip|reports|workers):"
          cat /tmp/jobs.txt

          sed -i "s|\${PROJECT_ID}|${{ env.PROJECT_ID }}|g" /tmp/run_pipeline.sh
          sed -i "s|\${DATA_BUCKET}|${{ env.DATA_BUCKET }}|g" /tmp/run_pipeline.sh
          sed -i "s|\${OUTPUT_PREFIX}|${{ env.OUTPUT_PREFIX }}|g" /tmp/run_pipeline.sh
          sed -i "s|\${CONTAINER_NAME}|${{ env.CONTAINER_NAME }}|g" /tmp/run_pipeline.sh
          sed -i "s|\${RUN_ID}|${{ github.run_id }}|g" /tmp/run_pipeline.sh
          sed -i "s|\${MAX_HOURS}|${{ inputs.max_hours || '12' }}|g" /tmp/run_pipeline.sh
          sed -i "s|\${PARSING_IMAGE}|${{ env.PARSING_IMAGE }}|g" /tmp/run_pipeline.sh

          chmod +x /tmp/run_pipeline.sh

          echo "Script contents:"
          head -40 /tmp/run_pipeline.sh
          echo "..."

          # Detached wrapper: enforces max_hours, streams the log + status to GCS,
          # and powers the VM off when finished (independent of this GitHub job)
          cat > /tmp/run_detached.sh << 'SCRIPT_EOF'
          #!/bin/bash
          export HOME="/var/tmp/cag"
          export DOCKER_CONFIG="${HOME}/.docker"
          mkdir -p "${DOCKER_CONFIG}"
          echo '{"credHelpers":{"us-central1-docker.pkg.dev":"gcr","gcr.io":"gcr"}}' > "${DOCKER_CONFIG}/config.json"

          DATA_BUCKET="${DATA_BUCKET}"
          RUN_ID="${RUN_ID}"
          KEEP_VM="${KEEP_VM}"
          MAX_HOURS="${MAX_HOURS}"
          CONTAINER_NAME="${CONTAINER_NAME}"
          RUN_DIR=/var/tmp/cag/runs-gpu/${RUN_ID}
          GCS_RUN=gs://${DATA_BUCKET}/runs-gpu/${RUN_ID}
          GCLOUD_IMAGE="gcr.io/google.com/cloudsdktool/google-cloud-cli:stable"
          sudo -n mkdir -p ${RUN_DIR}
          sudo -n chown "$(id -u):$(id -g)" ${RUN_DIR}

          gcs_cp() {
            docker run --rm --network=host -v ${RUN_DIR}:/run_dir ${GCLOUD_IMAGE} \
              gsutil -q cp "/run_dir/$1" "${GCS_RUN}/$1" || true
          }
          set_status() { echo "$1" > ${RUN_DIR}/status; gcs_cp status; }

          set_status running
          ( while sleep 300; do gcs_cp pipeline.log; done ) &
          SYNC_PID=$!

          # The pipeline itself is limited to MAX_HOURS inside run_pipeline.sh, which still
          # uploads results afterwards; this outer cap only guards against a hung upload
          OUTER_SECS=$(awk "BEGIN { printf \"%d\", (${MAX_HOURS} + 1) * 3600 }")
          timeout --kill-after=2m "${OUTER_SECS}s" bash /tmp/run_pipeline.sh > ${RUN_DIR}/pipeline.log 2>&1
          RC=$?

          kill ${SYNC_PID} 2>/dev/null
          if [ ${RC} -eq 124 ] || [ ${RC} -eq 137 ]; then
            echo "Run exceeded its time limit (${MAX_HOURS}h pipeline + 1h upload); stopping container" >> ${RUN_DIR}/pipeline.log
            docker rm -f ${CONTAINER_NAME} >> ${RUN_DIR}/pipeline.log 2>&1
            FINAL="timeout"
          elif [ ${RC} -eq 0 ]; then
            FINAL="success"
          elif [ ${RC} -eq 3 ]; then
            FINAL="partial"
          elif [ ${RC} -eq 4 ]; then
            FINAL="nothing_selected"
          else
            FINAL="failed:${RC}"
          fi
          gcs_cp pipeline.log
          gcs_cp jobs.txt
          set_status "${FINAL}"

          if [ "${KEEP_VM}" != "true" ]; then
            sudo -n poweroff
          fi
          SCRIPT_EOF

          sed -i "s|\${DATA_BUCKET}|${{ env.DATA_BUCKET }}|g" /tmp/run_detached.sh
          sed -i "s|\${RUN_ID}|${{ github.run_id }}|g" /tmp/run_detached.sh
          sed -i "s|\${KEEP_VM}|${{ inputs.keep_vm_running }}|g" /tmp/run_detached.sh
          sed -i "s|\${MAX_HOURS}|${{ inputs.max_hours || '12' }}|g" /tmp/run_detached.sh
          sed -i "s|\${CONTAINER_NAME}|${{ env.CONTAINER_NAME }}|g" /tmp/run_detached.sh

          gcloud compute scp /tmp/run_pipeline.sh /tmp/run_detached.sh /tmp/jobs.txt ${{ env.VM_NAME }}:/tmp/ \
            --zone=${{ env.ZONE }} \
            --project=${{ env.PROJECT_ID }}

      - name: Run Parsing Pipeline
        id: pipeline
        run: |
          GCS_RUN="gs://${{ env.DATA_BUCKET }}/runs-gpu/${{ github.run_id }}"
          echo "Running GPU parsing pipeline (detached on VM)..."
          echo "  VM: ${{ env.VM_NAME }} (${{ env.ZONE }})"
          echo "  Jobs (manifest|skip|reports|workers):"
          sed 's/^/    /' /tmp/jobs.txt
          echo "  Output: gs://${{ env.DATA_BUCKET }}/${{ env.OUTPUT_PREFIX }}/"
          echo "  Max hours: ${{ inputs.max_hours || '12' }}"
          echo "  Live log: ${GCS_RUN}/pipeline.log"

          gcloud compute ssh ${{ env.VM_NAME }} \
            --zone=${{ env.ZONE }} \
            --project=${{ env.PROJECT_ID }} \
            --command="setsid nohup bash /tmp/run_detached.sh > /dev/null 2>&1 < /dev/null & echo launched"
          echo "launched=true" >> $GITHUB_OUTPUT
          START_MIN=$(( ($(date +%s) - ${{ env.JOB_START }}) / 60 ))
          echo "Pipeline launched ${START_MIN} min after the job started"
          echo "start_min=${START_MIN}" >> $GITHUB_OUTPUT

          # Poll status; stop polling ~20 min before GitHub's 6h cap
          DEADLINE=$(( $(date +%s) + 300 * 60 ))
          LAST_LINES=0
          STATUS=""
          while [ $(date +%s) -lt ${DEADLINE} ]; do
            sleep 120
            STATUS=$(gcloud storage cat "${GCS_RUN}/status" 2>/dev/null || echo "pending")
            if gcloud storage cp "${GCS_RUN}/pipeline.log" /tmp/pipeline.log --quiet 2>/dev/null; then
              TOTAL=$(wc -l < /tmp/pipeline.log)
              if [ ${TOTAL} -gt ${LAST_LINES} ]; then
                tail -n +$((LAST_LINES + 1)) /tmp/pipeline.log
                LAST_LINES=${TOTAL}
              fi
            fi
            case "${STATUS}" in
              success)
                echo "✅ Pipeline completed successfully"
                echo "finished=true" >> $GITHUB_OUTPUT
                exit 0 ;;
              partial)
                echo "::error::Pipeline finished with failures (some reports, Phase 10 items or requested IDs). See the run summaries and jobs.txt in ${GCS_RUN}/"
                echo "finished=true" >> $GITHUB_OUTPUT
                exit 1 ;;
              nothing_selected)
                echo "::error::No reports were selected (empty manifest or --reports matched nothing)"
                echo "finished=true" >> $GITHUB_OUTPUT
                exit 1 ;;
              failed:*|timeout)
                echo "::error::Pipeline ${STATUS}. Full log: ${GCS_RUN}/pipeline.log"
                echo "finished=true" >> $GITHUB_OUTPUT
                exit 1 ;;
            esac
            VM_STATUS=$(gcloud compute instances describe ${{ env.VM_NAME }} \
              --zone=${{ env.ZONE }} --project=${{ env.PROJECT_ID }} --format="value(status)")
            if [ "${VM_STATUS}" = "TERMINATED" ]; then
              echo "::error::VM stopped before the pipeline reported a final status (last: ${STATUS})"
              echo "finished=true" >> $GITHUB_OUTPUT
              exit 1
            fi
          done

          echo "::notice::Pipeline still running on the VM (status: ${STATUS}). It continues without this job and powers the VM off when done. Status: ${GCS_RUN}/status"
          echo "finished=false" >> $GITHUB_OUTPUT

      # Skipped while the detached pipeline is still running (the VM powers itself off)
      - name: Stop GPU VM
        if: ${{ always() && !inputs.keep_vm_running && steps.guard.outputs.busy != 'true' && steps.pipeline.outputs.finished != 'false' }}
        run: |
          [ -n "${{ env.VM_NAME }}" ] || { echo "No VM was started"; exit 0; }
          echo "Stopping GPU VM ${{ env.VM_NAME }} to save costs..."
          gcloud compute instances stop ${{ env.VM_NAME }} \
            --zone=${{ env.ZONE }} \
            --project=${{ env.PROJECT_ID }} || true

      - name: Summary
        if: always()
        run: |
          echo "## Parsing Pipeline (GPU) Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**VM:** ${{ env.VM_NAME || 'none started' }} (${{ env.ZONE }})" >> $GITHUB_STEP_SUMMARY
          echo "**Jobs (manifest | skip | reports | workers):**" >> $GITHUB_STEP_SUMMARY
          if [ -s /tmp/jobs.txt ]; then
            sed 's/^/- /; s/|/ | /g' /tmp/jobs.txt >> $GITHUB_STEP_SUMMARY
          fi
          if gcloud storage cat "gs://${{ env.DATA_BUCKET }}/runs-gpu/${{ github.run_id }}/jobs.txt" > /tmp/jobs_done.txt 2>/dev/null; then
            echo "**Job results (job | run ID | exit code | manifest):**" >> $GITHUB_STEP_SUMMARY
            sed 's/^/- /; s/|/ | /g' /tmp/jobs_done.txt >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Output:** gs://${{ env.DATA_BUCKET }}/${{ env.OUTPUT_PREFIX }}/" >> $GITHUB_STEP_SUMMARY
          echo "**VM Kept Running:** ${{ inputs.keep_vm_running }}" >> $GITHUB_STEP_SUMMARY
          echo "**Max Hours:** ${{ inputs.max_hours || '12' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ env.PARSING_IMAGE }}" >> $GITHUB_STEP_SUMMARY
          echo "**Job start to pipeline launch:** ${{ steps.pipeline.outputs.start_min || '-' }} min" >> $GITHUB_STEP_SUMMARY
          echo "**Log / Status:** gs://${{ env.DATA_BUCKET }}/runs-gpu/${{ github.run_id }}/" >> $GITHUB_STEP_SUMMARY
