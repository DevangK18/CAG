# =============================================================================
# Run Parsing Pipeline
# =============================================================================
# Manually triggered workflow to run the parsing pipeline on GCP.
# Starts the parsing VM, runs the pipeline, and uploads results to GCS.
#
# Key details:
# - VM uses Debian 12 with Docker installed
# - SSH key is added to project metadata BEFORE VM starts (ensures key sync at boot)
# - Uses script file approach: create script → scp to VM → ssh execute

name: Run Parsing Pipeline

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: 'Manifest file name (in gs://bucket/manifests/)'
        required: true
        default: 'CAG_Union_Reports.xlsx'
        type: string
      skip_phases:
        description: 'Phases to skip (comma-separated, e.g., 10a,10b,10c)'
        required: false
        type: string
        default: ''
      reports:
        description: 'Specific report IDs (space-separated, leave empty for all)'
        required: false
        type: string
        default: ''
      keep_vm_running:
        description: 'Keep VM running after completion (for debugging)'
        required: false
        type: boolean
        default: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  ZONE: us-central1-a
  VM_NAME: cag-parsing-vm
  DATA_BUCKET: cag-data-443e4a28

jobs:
  run-parsing:
    name: Run Parsing Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Push Parsing Image
        run: |
          IMAGE="us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/cag-images/cag-parsing:latest"
          echo "Building parsing image: $IMAGE"
          docker build -f Dockerfile.parsing -t "$IMAGE" .
          echo "Pushing to Artifact Registry..."
          docker push "$IMAGE"
          echo "✅ Parsing image built and pushed"

      - name: Setup SSH Key
        run: |
          # Generate SSH key and add to project metadata BEFORE starting VM
          # This ensures the VM syncs this key at boot time
          echo "Setting up SSH keys..."
          gcloud compute config-ssh --project=${{ env.PROJECT_ID }} --quiet
          echo "SSH keys configured"

      - name: Start Parsing VM
        run: |
          echo "Starting VM: ${{ env.VM_NAME }}"
          gcloud compute instances start ${{ env.VM_NAME }} \
            --zone=${{ env.ZONE }} \
            --project=${{ env.PROJECT_ID }} || true

          echo "Waiting for VM to be ready..."
          sleep 90

      - name: Wait for VM SSH
        run: |
          for i in {1..5}; do
            echo "Attempt $i: trying SSH..."
            if gcloud compute ssh ${{ env.VM_NAME }} \
              --zone=${{ env.ZONE }} \
              --project=${{ env.PROJECT_ID }} \
              --command="echo 'VM is ready'" 2>&1; then
              echo "VM SSH is ready"
              exit 0
            fi
            echo "Attempt $i failed, waiting..."
            sleep 15
          done
          echo "Failed to connect to VM"
          exit 1

      - name: Create and copy run script
        run: |
          # Create the script locally
          cat > /tmp/run_pipeline.sh << 'SCRIPT_EOF'
          #!/bin/bash
          set -e

          # FIRST: Fix Docker config BEFORE any docker commands
          # COS VM may have stale HOME pointing to /home/runner from SSH
          export HOME="/var/tmp/cag"
          export DOCKER_CONFIG="${HOME}/.docker"
          mkdir -p "${DOCKER_CONFIG}"
          echo '{"credHelpers":{"us-central1-docker.pkg.dev":"gcr","gcr.io":"gcr"}}' > "${DOCKER_CONFIG}/config.json"
          echo "Docker config set up at: ${DOCKER_CONFIG}/config.json"

          # Configuration - these are replaced by sed below
          DATA_BUCKET="${DATA_BUCKET}"
          PROJECT_ID="${PROJECT_ID}"
          # Trim any whitespace from PROJECT_ID (secrets sometimes have trailing newlines)
          PROJECT_ID=$(echo "${PROJECT_ID}" | tr -d '[:space:]')
          MANIFEST="${MANIFEST}"
          SKIP_ARG="${SKIP_ARG}"
          REPORTS_ARG="${REPORTS_ARG}"

          echo "============================================="
          echo "CAG Parsing Pipeline"
          echo "============================================="
          echo "PROJECT_ID: ${PROJECT_ID}"
          echo "DATA_BUCKET: ${DATA_BUCKET}"
          echo "MANIFEST: ${MANIFEST}"
          echo "SKIP_ARG: ${SKIP_ARG}"
          echo "REPORTS_ARG: ${REPORTS_ARG}"
          echo "HOME: ${HOME}"
          echo "DOCKER_CONFIG: ${DOCKER_CONFIG}"
          echo ""

          # Use /var/tmp for Container-Optimized OS (root is read-only)
          WORK_DIR=/var/tmp/cag
          echo "Setting up work directory: ${WORK_DIR}"
          mkdir -p ${WORK_DIR}/data/{raw,processed,batch_jobs,extraction_images,entity_graph,canonical}/{union,state,local_body}
          mkdir -p ${WORK_DIR}/data/processed/ocred
          mkdir -p ${WORK_DIR}/data/batch_jobs/{jobs,overviews,summaries,hierarchical,visual_extraction,enrichment,chart_extraction}
          mkdir -p ${WORK_DIR}/data/extraction_images/{tables,charts}
          mkdir -p ${WORK_DIR}/logs/traces/{union,state,local_body}

          # The parsing image is ~32GB unpacked; each pull of :latest leaves the previous
          # one dangling, which filled the 100GB disk. Keep only the current image.
          echo "Removing old parsing images..."
          docker image prune -f
          df -h / | tail -1

          # Google Cloud CLI Docker image for gsutil (COS doesn't have gsutil installed)
          GCLOUD_IMAGE="gcr.io/google.com/cloudsdktool/google-cloud-cli:stable"

          echo "Pulling Google Cloud CLI image for gsutil operations..."
          docker pull ${GCLOUD_IMAGE}

          # Helper function to run gsutil via Docker
          # Uses --network=host to access GCE metadata server for authentication
          run_gsutil() {
            docker run --rm --network=host \
              -v ${WORK_DIR}:/workspace \
              ${GCLOUD_IMAGE} \
              gsutil "$@"
          }

          echo "Syncing existing data from GCS..."
          run_gsutil -m rsync -r gs://${DATA_BUCKET}/raw/ /workspace/data/raw/ 2>/dev/null || true
          run_gsutil -m rsync -r gs://${DATA_BUCKET}/processed/ /workspace/data/processed/ 2>/dev/null || true

          echo "Downloading manifest..."
          run_gsutil cp "gs://${DATA_BUCKET}/manifests/${MANIFEST}" /workspace/manifest.xlsx

          echo "Pulling latest parsing image..."
          PARSING_IMAGE="us-central1-docker.pkg.dev/${PROJECT_ID}/cag-images/cag-parsing:latest"
          echo "Image to pull: ${PARSING_IMAGE}"
          docker pull "${PARSING_IMAGE}" || {
            echo "ERROR: Failed to pull parsing image."
            echo "Checking if image exists..."
            echo "Project ID: ${PROJECT_ID}"
            echo "Expected image: ${PARSING_IMAGE}"
            exit 1
          }
          docker image prune -f
          df -h / | tail -1

          echo "Starting parsing pipeline..."

          # Check if GPU is available and set Docker GPU flag
          GPU_FLAG=""
          if command -v nvidia-smi &> /dev/null && nvidia-smi &> /dev/null; then
            echo "🚀 GPU detected: $(nvidia-smi --query-gpu=name --format=csv,noheader)"
            GPU_FLAG="--gpus all"
          else
            echo "No GPU detected, running on CPU"
          fi

          # --network=host allows container to access GCE metadata server for Vertex AI ADC
          docker run --rm --network=host ${GPU_FLAG} \
            -v ${WORK_DIR}/data:/app/data \
            -v ${WORK_DIR}/logs:/app/logs \
            -v ${WORK_DIR}/manifest.xlsx:/app/manifest.xlsx \
            -e DATA_BUCKET=${DATA_BUCKET} \
            -e GOOGLE_CLOUD_PROJECT=${PROJECT_ID} \
            -e VERTEX_AI_REGION=us-central1 \
            -e USE_VERTEX_AI=true \
            -e USE_VERTEX_EMBEDDINGS=true \
            -e LLM_PROVIDER=gemini \
            ${PARSING_IMAGE} \
            manifest.xlsx ${SKIP_ARG} ${REPORTS_ARG}

          echo "Uploading results to GCS..."
          run_gsutil -m rsync -r /workspace/data/processed gs://${DATA_BUCKET}/processed/
          run_gsutil -m rsync -r /workspace/data/raw gs://${DATA_BUCKET}/raw/
          run_gsutil -m rsync -r /workspace/data/batch_jobs gs://${DATA_BUCKET}/batch_jobs/
          run_gsutil -m rsync -r /workspace/data/extraction_images gs://${DATA_BUCKET}/extraction_images/ 2>/dev/null || true
          run_gsutil -m rsync -r /workspace/data/entity_graph gs://${DATA_BUCKET}/entity_graph/ 2>/dev/null || true
          run_gsutil -m rsync -r /workspace/data/canonical gs://${DATA_BUCKET}/canonical/ 2>/dev/null || true
          run_gsutil -m rsync -r /workspace/logs/traces gs://${DATA_BUCKET}/traces/ 2>/dev/null || true
          run_gsutil -m cp /workspace/logs/*.log gs://${DATA_BUCKET}/logs/ 2>/dev/null || true

          echo ""
          echo "============================================="
          echo "Parsing pipeline complete!"
          echo "============================================="
          SCRIPT_EOF

          # Replace placeholders with actual values
          SKIP_ARG=""
          if [ -n "${{ inputs.skip_phases }}" ]; then
            SKIP_ARG="--skip ${{ inputs.skip_phases }}"
          fi

          REPORTS_ARG=""
          if [ -n "${{ inputs.reports }}" ]; then
            REPORTS_ARG="--reports ${{ inputs.reports }}"
          fi

          sed -i "s|\${PROJECT_ID}|${{ env.PROJECT_ID }}|g" /tmp/run_pipeline.sh
          sed -i "s|\${DATA_BUCKET}|${{ env.DATA_BUCKET }}|g" /tmp/run_pipeline.sh
          sed -i "s|\${MANIFEST}|${{ inputs.manifest }}|g" /tmp/run_pipeline.sh
          sed -i "s|\${SKIP_ARG}|${SKIP_ARG}|g" /tmp/run_pipeline.sh
          sed -i "s|\${REPORTS_ARG}|${REPORTS_ARG}|g" /tmp/run_pipeline.sh

          chmod +x /tmp/run_pipeline.sh

          echo "Script contents:"
          head -50 /tmp/run_pipeline.sh
          echo "..."

          # Copy script to VM
          gcloud compute scp /tmp/run_pipeline.sh ${{ env.VM_NAME }}:/tmp/run_pipeline.sh \
            --zone=${{ env.ZONE }} \
            --project=${{ env.PROJECT_ID }}

      - name: Run Parsing Pipeline
        run: |
          echo "Running parsing pipeline..."
          echo "  Manifest: ${{ inputs.manifest }}"
          echo "  Skip phases: ${{ inputs.skip_phases }}"
          echo "  Reports: ${{ inputs.reports }}"

          # SSH keep-alives are protocol-level (independent of pipeline output), so a
          # 5-minute tolerance is enough and detects a lost VM quickly (was 30 min)
          START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if ! gcloud compute ssh ${{ env.VM_NAME }} \
            --zone=${{ env.ZONE }} \
            --project=${{ env.PROJECT_ID }} \
            --ssh-flag="-o ServerAliveInterval=30" \
            --ssh-flag="-o ServerAliveCountMax=10" \
            --command="bash /tmp/run_pipeline.sh"; then
            PREEMPTED=$(gcloud compute operations list \
              --project=${{ env.PROJECT_ID }} \
              --filter="operationType=compute.instances.preempted AND targetLink~${{ env.VM_NAME }} AND insertTime>=${START}" \
              --format="value(insertTime)")
            if [ -n "${PREEMPTED}" ]; then
              echo "::error::Spot VM was preempted by GCP at ${PREEMPTED}. Not a pipeline error; re-run the workflow."
            fi
            exit 1
          fi

      - name: Stop Parsing VM
        if: ${{ !inputs.keep_vm_running && always() }}
        run: |
          echo "Stopping VM to save costs..."
          gcloud compute instances stop ${{ env.VM_NAME }} \
            --zone=${{ env.ZONE }} \
            --project=${{ env.PROJECT_ID }} || true

      - name: Summary
        run: |
          echo "## Parsing Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Manifest:** ${{ inputs.manifest }}" >> $GITHUB_STEP_SUMMARY
          echo "**Skipped Phases:** ${{ inputs.skip_phases || 'None' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Reports:** ${{ inputs.reports || 'All' }}" >> $GITHUB_STEP_SUMMARY
          echo "**VM Kept Running:** ${{ inputs.keep_vm_running }}" >> $GITHUB_STEP_SUMMARY
